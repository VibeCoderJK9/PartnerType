name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Do not use this form; see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 0.1.0 or 3351ce0
  - type: dropdown
    id: role
    attributes:
      label: Role
      options: [admin, manager, observer, partner, operator (server), not relevant]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal data, passwords and keys first.
