# Dependency updates arrive grouped, one pull request per ecosystem per month,
# so each round runs the test suite once instead of once per package.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: monthly}
    groups:
      javascript: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
    groups:
      docker: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
