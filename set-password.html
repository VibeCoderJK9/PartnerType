<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Anti-flash: set theme before render -->
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/theme-boot.css">
  <title data-i18n="partner_center_ustaw_haslo">PartnerType — Set a password</title>
  <meta name="description" data-i18n="meta_set_password" data-i18n-attr="content" content="Set the password for your PartnerType partner account.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/theme-v1.1.2.css">
</head>
<body>

<div class="register-page">
  <!-- Form area (no marketing panel: an invited partner opens this from a
       one-time link, not a browsing session — the shell it needs is a card,
       not a pitch). -->
  <div class="register-form-area">
    <div class="register-form-wrap" style="max-width:440px">

      <div style="margin-bottom:32px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
          <div style="width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0">
            <img class="brand-logo brand-logo-light" src="img/logo-light-128.png" alt="PartnerType" style="width:100%; height:100%; object-fit:contain; border-radius:8px;"><img class="brand-logo brand-logo-dark" src="img/logo-dark-128.png" alt="" style="width:100%; height:100%; object-fit:contain; border-radius:8px;">
          </div>
          <span data-i18n="partner_center" style="font-size:1.125rem;font-weight:800;color:var(--text-primary)">PartnerType</span>
        </div>
        <h1 data-i18n="ustaw_haslo" style="font-size:1.5rem;font-weight:800;color:var(--text-primary);margin-bottom:6px">Set a password</h1>
        <p data-i18n="ostatni_krok_wybierz_haslo_do_swojego_konta" style="font-size:0.9375rem;color:var(--text-secondary)">Last step — choose a password for your account.</p>
      </div>

      <!-- Invalid / expired / used / missing token: one clear sentence, never a
           blank screen and never a stack trace. -->
      <div id="sp-invalid" hidden style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding:24px 0">
        <div class="success-icon" style="background:rgba(239,68,68,0.12);color:var(--error-400)" id="sp-invalid-icon"></div>
        <div>
          <h2 data-i18n="link_nie_dziala" style="font-size:1.25rem;font-weight:700;color:var(--text-primary);margin-bottom:8px">This link does not work</h2>
          <p data-i18n="ten_link_do_ustawienia_hasla_jest_nieprawidlowy_" style="font-size:0.9375rem;color:var(--text-secondary);max-width:360px;margin:0 auto;line-height:1.6">
            This password link is invalid, has expired or has already been used. Ask an administrator for a new invitation.
          </p>
        </div>
        <a data-i18n="przejdz_do_logowania" href="index.html" class="btn btn-primary btn-lg">Go to sign in</a>
      </div>

      <!-- Set-password form, shown once the token previews successfully. -->
      <form id="sp-form" novalidate hidden>
        <div style="display:flex;flex-direction:column;gap:20px">

          <div class="form-group">
            <label data-i18n="setpw_account" class="form-label">Account</label>
            <div id="sp-invitee" class="text-sm" style="padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary)"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="sp-password"><span data-i18n="setpw_password">Password</span> <span class="required">*</span></label>
            <div class="input-wrapper">
              <svg class="input-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input data-i18n="min_8_znakow" data-i18n-attr="placeholder" type="password" id="sp-password" class="form-input" placeholder="Min. 8 characters" required>
              <button type="button" class="password-toggle" id="sp-toggle-password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-tertiary)">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="password-strength" id="sp-pw-strength">
              <div class="strength-bar" id="sp-sb1"></div>
              <div class="strength-bar" id="sp-sb2"></div>
              <div class="strength-bar" id="sp-sb3"></div>
              <div class="strength-bar" id="sp-sb4"></div>
            </div>
            <div data-i18n="setpw_enter_password" class="strength-label text-xs text-tertiary" id="sp-strength-label">Enter a password</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="sp-password2"><span data-i18n="setpw_password_repeat">Repeat the password</span> <span class="required">*</span></label>
            <div class="input-wrapper">
              <svg class="input-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input data-i18n="powtorz_haslo" data-i18n-attr="placeholder" type="password" id="sp-password2" class="form-input" placeholder="Repeat password" required>
            </div>
            <div class="form-hint" id="sp-match-hint"></div>
          </div>

          <div class="auth-error" id="sp-error" role="alert" aria-live="assertive" style="display:none;padding:12px 16px;background:var(--error-bg);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-md);font-size:0.875rem;color:var(--error-400)"></div>

          <button data-i18n="ustaw_haslo_i_przejdz_do_logowania" type="submit" class="btn btn-primary btn-lg" id="sp-submit" style="width:100%">Set password and go to sign in</button>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/datepicker.js"></script>
<script src="js/api.js"></script>
<!-- app.js is what reveals the page: it adds body.ready, which the anti-flash
     rule in <head> waits for. Without it this page renders at opacity 0. -->
<script src="/locales.js"></script>
<script src="js/app.js"></script>
<script src="js/set-password.js"></script>
<script src="js/branding.js"></script>
</body>
</html>
